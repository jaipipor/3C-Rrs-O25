[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "rrs3c"
version = "1.0.3"
description = "Analytical 3C Remote Sensing Reflectance (Rrs) model, O25 variant."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

authors = [
    { name = "Jaime Pitarch", email = "jaime.pitarch@cnr.it" },
]

dependencies = [
    "numpy>=1.24",
    "scipy",
    "lmfit",
]


[project.optional-dependencies]
examples = [
    "pandas",
    "matplotlib",
]

timeseries = [
    "pandas",
    "matplotlib",
    "xarray",
]

dev = [
    "build",
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]


[project.urls]
Repository = "https://github.com/jaipipor/3C-Rrs-O25"
Issues = "https://github.com/jaipipor/3C-Rrs-O25/issues"
Changelog = "https://github.com/jaipipor/3C-Rrs-O25/blob/main/CHANGELOG.md"


[tool.setuptools.packages.find]
where = ["src"]


[tool.black]
line-length = 88
target-version = ["py310"]


[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
