name: CI

on:
  push:
    branches:
      - main
      - "release/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Display Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[timeseries,dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python files
        run: >
          python -m compileall -q
          src
          scripts
          examples/timeseries/src
          tests

      - name: Run automated tests
        run: python -m pytest -q

  quality:
    name: Quality and packaging

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[timeseries,dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Black formatting
        run: python -m black --check .

      - name: Run single-spectrum smoke test
        run: >
          python scripts/run_3C.py
          --input examples/example_single_spectrum.csv
          --theta-s 59
          --theta-v 35
          --phi 100
          --am 4
          --rh 60
          --pressure 1013.25
          --no-plot
          --quiet

      - name: Build source distribution and wheel
        run: python -m build

      - name: List distribution artifacts
        shell: bash
        run: ls -lh dist
